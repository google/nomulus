    - ../../jetty/kubernetes/gateway/nomulus-gateway.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-production-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-production-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-production-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-production-pubapi.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-production-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-production-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-production-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-production-pubapi.yaml
  deploy:
