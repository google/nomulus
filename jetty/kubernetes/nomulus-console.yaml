apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  annotations:
    tag: "latest"
spec:
  selector:
    matchLabels:
      service: console
  template:
    metadata:
      labels:
        service: console
        traffic: console-all
    spec:
      serviceAccountName: nomulus
      containers:
      - name: console
        image: gcr.io/GCP_PROJECT/nomulus
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          httpGet:
            port: 8080
            path: /ready/console
          initialDelaySeconds: 1
          timeoutSeconds: 60
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 30
        resources:
          requests:
            # explicit pod-slots 0 is required in order to downgrade node 
            # class from performance, which has implicit pod-slots 1
            cloud.google.com/pod-slots: 0
            cpu: "100m"
            memory: "1Gi"
          limits:
            # explicit pod-slots 0 is required in order to downgrade node 
            # class from performance, which has implicit pod-slots 1
            cloud.google.com/pod-slots: 0
            cpu: "500m"
            memory: "2Gi"
        args: [ENVIRONMENT]
        env:
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JETTY_WORKER_INSTANCE
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONTAINER_NAME
          value: console
        # TODO(b/587369531): Remove once all rollback-eligible images disable
        # Base64 intrinsics or bundle a patched JDK 25.
        - name: JDK_JAVA_OPTIONS
          value: "-XX:-UseBASE64Intrinsics"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: console
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: console
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector:
    traffic: console-all
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: net.gke.io/v1
kind: ServiceExport
metadata:
  name: console
