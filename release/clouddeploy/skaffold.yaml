# skaffold.yaml
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: nomulus-skaffold
profiles:
- name: crash
  # Note: The stable profile intentionally includes partial-phase-5 manifests alongside
  # primary workloads. This ensures that the candidate image is deployed across both deployments,
  # maintaining stable pod and GKE node allocation to prevent churn on nodes hosting persistent
  # registrar sessions.
  manifests:
    rawYaml:
    - ../../jetty/kubernetes/nomulus-crash-backend.yaml
    - ../../jetty/kubernetes/nomulus-crash-console.yaml
    - ../../jetty/kubernetes/nomulus-crash-frontend.yaml
    - ../../jetty/kubernetes/nomulus-crash-pubapi.yaml
    - ../../jetty/kubernetes/nomulus-crash-epp-server.yaml
    - ../../jetty/kubernetes/nomulus-crash-backend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-console-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-frontend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-pubapi-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-epp-server-partial-phase-5.yaml
    # Gateway, HTTPRoutes (+ HealthCheckPolicies) and GCPBackendPolicies. Stable profile only,
    # so they are applied once per rollout. They go out in the same `kubectl apply` as the
    # workloads above (after them, but before their rollout finishes), so ship networking
    # changes that need new code in a later release than the code itself.
    - ../../jetty/kubernetes/gateway/nomulus-gateway.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-crash-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-crash-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-crash-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-crash-pubapi.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-crash-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-crash-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-crash-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-crash-pubapi.yaml
  deploy:
    kubectl: { }
- name: crash-partial-phase-1
  manifests:
    rawYaml:
    - ../../jetty/kubernetes/nomulus-crash-backend-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-crash-console-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-crash-frontend-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-crash-pubapi-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-crash-epp-server-partial-phase-1.yaml
  deploy:
    kubectl: { }
- name: crash-partial-phase-5
  manifests:
    rawYaml:
    - ../../jetty/kubernetes/nomulus-crash-backend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-console-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-frontend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-pubapi-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-crash-epp-server-partial-phase-5.yaml
  deploy:
    kubectl: { }
- name: sandbox
