    - ../../jetty/kubernetes/nomulus-sandbox-frontend.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-pubapi.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-epp-server.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-backend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-console-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-frontend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-pubapi-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-epp-server-partial-phase-5.yaml
    # Gateway, HTTPRoutes (+ HealthCheckPolicies) and GCPBackendPolicies. Stable profile only,
    # so they are applied once per rollout. They go out in the same `kubectl apply` as the
    # workloads above (after them, but before their rollout finishes), so ship networking
    # changes that need new code in a later release than the code itself.
    - ../../jetty/kubernetes/gateway/nomulus-gateway.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-sandbox-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-sandbox-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-sandbox-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-route-sandbox-pubapi.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-sandbox-backend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-sandbox-console.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-sandbox-frontend.yaml
    - ../../jetty/kubernetes/gateway/nomulus-backend-policy-sandbox-pubapi.yaml
  deploy:
    kubectl: { }
- name: sandbox-partial-phase-1
  manifests:
    rawYaml:
    - ../../jetty/kubernetes/nomulus-sandbox-backend-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-console-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-frontend-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-pubapi-partial-phase-1.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-epp-server-partial-phase-1.yaml
  deploy:
    kubectl: { }
- name: sandbox-partial-phase-5
  manifests:
    rawYaml:
    - ../../jetty/kubernetes/nomulus-sandbox-backend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-console-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-frontend-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-pubapi-partial-phase-5.yaml
    - ../../jetty/kubernetes/nomulus-sandbox-epp-server-partial-phase-5.yaml
  deploy:
    kubectl: { }
