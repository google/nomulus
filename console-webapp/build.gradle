def consoleDir = "${rootDir}/console-webapp"
def projectParam = "--project=${rootProject.gcpProject}"

clean {
  delete "${consoleDir}/.angular"
  delete "${consoleDir}/node_modules"
  delete "${consoleDir}/staged/dist"
}

def consoleSourceInputs = [
  "${consoleDir}/package.json",
  "${consoleDir}/package-lock.json",
  "${consoleDir}/angular.json",
  "${consoleDir}/tsconfig.json",
  "${consoleDir}/tsconfig.app.json",
]

task npmInstallDeps(type: Exec) {
  workingDir "${consoleDir}/"
  inputs.files("${consoleDir}/package.json", "${consoleDir}/package-lock.json")
  outputs.dir("${consoleDir}/node_modules")
  commandLine 'sh', '-c', 'npm i --no-audit --no-fund --loglevel=error'
}

task runConsoleWebappLocally(type: Exec) {
  workingDir "${consoleDir}/"
  commandLine 'sh', '-c', 'npm run start:dev'
}

task runConsoleWebappUnitTests(type: Exec) {
  workingDir "${consoleDir}/"
  inputs.dir("${consoleDir}/src")
  inputs.files(consoleSourceInputs)
  inputs.file("${consoleDir}/tsconfig.spec.json")
  outputs.upToDateWhen { true }
  commandLine 'sh', '-c', 'npm run test'
}

task buildConsoleWebapp(type: Exec) {
  workingDir "${consoleDir}/"
  def configuration = project.getProperty('configuration')
  inputs.property('configuration', configuration)
  inputs.dir("${consoleDir}/src")
  inputs.files(consoleSourceInputs)
  outputs.dir("${consoleDir}/staged/dist")
  commandLine 'sh', '-c', "npx ng build --base-href=/console/ --configuration=${configuration} --output-path=staged/dist"
  doFirst {
    println "Building console for environment: ${configuration}"
  }
}

task buildConsoleForAll() {}

def createConsoleBuildTask = { env ->
  project.tasks.register("buildConsoleFor${env.capitalize()}", Exec) {
    workingDir "${consoleDir}/"
    inputs.dir("${consoleDir}/src")
    inputs.files(consoleSourceInputs)
    outputs.dir("${consoleDir}/staged/console-${env}")
    commandLine 'sh', '-c', "npx ng build --base-href=/console/ --configuration=${env}"
    doFirst {
      println "Building console for environment: ${env}"
    }
    doLast {
      copy {
        from "${consoleDir}/staged/dist/"
        into "${consoleDir}/staged/console-${env}"
      }
      delete "${consoleDir}/staged/dist"
    }
    dependsOn(tasks.npmInstallDeps)
  }
}

def createConsoleCopyTask = { env, sourceEnv ->
  project.tasks.register("buildConsoleFor${env.capitalize()}", Copy) {
    from "${consoleDir}/staged/console-${sourceEnv}"
    into "${consoleDir}/staged/console-${env}"
    dependsOn(tasks.named("buildConsoleFor${sourceEnv.capitalize()}"))
  }
}

['alpha', 'sandbox', 'production'].forEach { env ->
  createConsoleBuildTask(env)
}

// 'crash' and 'qa' share the exact same unoptimized build configuration as 'alpha'
['crash', 'qa'].forEach { env ->
  createConsoleCopyTask(env, 'alpha')
}

['alpha', 'crash', 'qa', 'sandbox', 'production'].forEach { env ->
  project.tasks.register("deleteConsoleFor${env.capitalize()}", Delete) {
    delete "${consoleDir}/staged/console-${env}"
  }
  tasks.named('clean') {
    dependsOn(tasks.named("deleteConsoleFor${env.capitalize()}"))
  }
  tasks.named('buildConsoleForAll') {
    dependsOn(tasks.named("buildConsoleFor${env.capitalize()}"))
  }
}

// Force an order so the Exec tasks that stage through staged/dist don't run in parallel.
tasks.buildConsoleForSandbox.mustRunAfter(tasks.buildConsoleForAlpha)
tasks.buildConsoleForProduction.mustRunAfter(tasks.buildConsoleForSandbox)
// This task must run last, otherwise the previous tasks will have deleted the "dist" folder.
tasks.buildConsoleWebapp.mustRunAfter(tasks.buildConsoleForProduction)

task applyFormatting(type: Exec) {
  workingDir "${consoleDir}/"
  commandLine 'sh', '-c', 'npm run prettify'
}

task checkFormatting(type: Exec) {
  workingDir "${consoleDir}/"
  inputs.dir("${consoleDir}/src")
  outputs.upToDateWhen { true }
  commandLine 'sh', '-c', 'npm run prettify:check'
}

tasks.buildConsoleWebapp.dependsOn(tasks.npmInstallDeps)
tasks.runConsoleWebappUnitTests.dependsOn(tasks.npmInstallDeps)
tasks.applyFormatting.dependsOn(tasks.npmInstallDeps)
tasks.checkFormatting.dependsOn(tasks.npmInstallDeps)
tasks.test.dependsOn(tasks.runConsoleWebappUnitTests)
tasks.build.dependsOn(tasks.checkFormatting)
tasks.build.dependsOn(tasks.runConsoleWebappUnitTests)
tasks.build.dependsOn(tasks.buildConsoleForAll)
